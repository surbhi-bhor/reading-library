name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity, and the weekly
# build reads it only once a week. One small read on Tuesdays keeps it awake.
on:
  schedule:
    - cron: "0 0 * * 2"   # Tuesdays 00:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one recommendation id
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "Supabase not configured"; exit 0; fi
          curl -sf -o /dev/null "${SUPABASE_URL%/}/rest/v1/recommendations?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"
          echo "Supabase is awake"
