name: Nightly build and deploy

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every night
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WAREHOUSE_PATH: ${{ github.workspace }}/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: pip install -r requirements-dev.txt
      # The same gates as CI: nothing deploys after a failing test.
      - run: ruff check .
      - run: pytest -q

      # Raw data never goes into the repository. The last good extract lives in
      # the Actions cache instead (private to the repo, not in git), so the
      # extract can keep yesterday's articles or recommendations when Raindrop or
      # Supabase is down, and reuse Open Library matches instead of redoing them.
      - name: Restore the last good extract
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # Fresh data on every run. If Hardcover fails or answers empty, the job
      # stops here and the live site stays as it was. Articles (Raindrop) and
      # recommendations (Supabase) are optional: if either is down, the step
      # still passes and the cached copies stay.
      - name: Extract from Hardcover, Open Library, Raindrop and Supabase
        env:
          HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m extract

      - name: dbt build (models and tests)
        working-directory: dbt
        run: dbt build --profiles-dir .
      # Only an extract that passed every dbt test becomes the next fallback.
      - name: Keep this extract as the next fallback
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
      - name: Source freshness (warn only)
        working-directory: dbt
        run: dbt source freshness --profiles-dir . || echo "::warning::raw extracts are stale"
      - name: dbt docs
        working-directory: dbt
        run: dbt docs generate --profiles-dir .

      - name: Build site
        working-directory: site
        # The form's two public values (the anon key is built to be public; the table only accepts inserts).
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm test
          npm run build
      - run: python scripts/copy_dbt_docs.py

      # Hosting is on Vercel (for its Web Analytics). Actions still runs the whole
      # pipeline and only hands Vercel the finished static site; vercel.json says
      # there is nothing for Vercel to build.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          cp site/vercel.json site/og.jpg site/dist/
          npx --yes vercel@65.11.0 deploy site/dist --prod --yes --token "$VERCEL_TOKEN"
