name: Nightly build and deploy

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every night
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WAREHOUSE_PATH: ${{ github.workspace }}/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: pip install -r requirements-dev.txt
      # The same gates as CI: nothing deploys after a failing test.
      - run: ruff check .
      - run: pytest -q

      # Fresh data only on the schedule or a manual run; a push rebuilds from the
      # committed raw files. A failure here stops the job, so the live site and
      # the committed raw files stay as they were.
      # Articles come from Raindrop too; without RAINDROP_TOKEN, or if Raindrop
      # is down, the step still passes and the saved articles stay.
      # Recommendations come from Supabase (approved rows only); without its
      # settings the step still passes and the saved ones stay.
      - name: Extract from Hardcover, Open Library, Raindrop and Supabase
        if: github.event_name != 'push'
        env:
          HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m extract

      - name: dbt build (models and tests)
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: Source freshness (warn only)
        working-directory: dbt
        run: dbt source freshness --profiles-dir . || echo "::warning::raw extracts are stale"
      - name: dbt docs
        working-directory: dbt
        run: dbt docs generate --profiles-dir .

      - name: Build site
        working-directory: site
        # The form's two public values (the anon key is built to be public; the table only accepts inserts).
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm test
          npm run build
      - run: python scripts/copy_dbt_docs.py

      # Only after every test passed: keep the new raw extract in git.
      - name: Commit raw extract
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data/raw)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw
            git commit -m "data: nightly extract"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
