name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Builds from the committed raw files, so no secrets are needed here.
      - name: dbt build
        working-directory: dbt
        env:
          WAREHOUSE_PATH: ${{ runner.temp }}/warehouse.duckdb
        run: dbt build --profiles-dir .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Site tests and build
        working-directory: site
        env:
          WAREHOUSE_PATH: ${{ runner.temp }}/warehouse.duckdb
        run: |
          npm ci
          npm test
          npm run build
