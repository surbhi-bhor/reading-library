name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # No raw data lives in the repository, so CI checks that every dbt model
      # compiles; the full build with data and data tests runs in the nightly job.
      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Site tests
        working-directory: site
        run: |
          npm ci
          npm test
